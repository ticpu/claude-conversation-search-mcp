name: Release

on:
  push:
    branches:
      - 'ci/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GLIBC_MAX: '2.28'

jobs:
  linux-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: claude-conversation-search-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            artifact_name: claude-conversation-search-linux-aarch64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build binary in Debian container
        run: |
          docker build -f Containerfile --build-arg TARGET=${{ matrix.target }} -t ccs-build .
          container=$(docker create ccs-build)
          docker cp "$container:/out/claude-conversation-search" ${{ matrix.artifact_name }}
          docker rm "$container"
        env:
          DOCKER_BUILDKIT: 1

      - name: Check glibc floor
        run: |
          max=$(readelf -V ${{ matrix.artifact_name }} | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol version required: ${max:-none}"
          if [ "$(printf '%s\n%s\n' "$max" "$GLIBC_MAX" | sort -V | tail -1)" != "$GLIBC_MAX" ]; then
            echo "binary requires glibc newer than $GLIBC_MAX" >&2
            exit 1
          fi

      - name: Smoke-test binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: ./${{ matrix.artifact_name }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  other-binaries:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: claude-conversation-search-windows-x86_64.exe
            binary_ext: '.exe'
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: claude-conversation-search-macos-aarch64
            binary_ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/claude-conversation-search

      - name: Rename binary
        shell: bash
        run: mv target/${{ matrix.target }}/release/claude-conversation-search${{ matrix.binary_ext }} ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs:
      - linux-binaries
      - other-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          git archive --format=tar --prefix="claude-conversation-search-${VERSION}/" HEAD | xz -c > "claude-conversation-search-${VERSION}.tar.xz"

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            claude-conversation-search-*.tar.xz
            artifacts/*/*
          draft: true
          prerelease: false
          generate_release_notes: true
          append_body: true
          body: |
            The Linux binaries are built on Debian 10 (glibc 2.28), so they run on
            Debian 10+, Ubuntu 18.10+, RHEL 8+ and anything newer.

            Release assets are signed; each has a detached `.asc` alongside it.
