[package]
name = "claude-conversation-search"
version = "1.5.1"
edition = "2024"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
license = "GPL-3.0-only"
description = "Full-text search over Claude Code conversation history, as a CLI and as an MCP server"
repository = "https://github.com/ticpu/claude-conversation-search-mcp"
homepage = "https://github.com/ticpu/claude-conversation-search-mcp"
readme = "README.md"
keywords = ["claude", "mcp", "search", "tantivy", "cli"]
categories = ["command-line-utilities", "text-processing"]

[features]
default = []

[dependencies]
tantivy = "0.22"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
dirs = "5.0"
glob = "0.3"
regex = "1.0"
once_cell = "1.0"
uuid = { version = "1.0", features = ["v4"] }
fs2 = "0.4"
strip-ansi-escapes = "0.2.1"

[target.'cfg(unix)'.dependencies]
exec = "0.3"
nix = { version = "0.29", features = ["term"] }

[dev-dependencies]
tempfile = "3"
